apply from: 'lombok.gradle'

configurations {
    all {
        exclude group: 'xml-apis', module: 'xml-apis'
    }
}

dependencies {
    // General
    implementation 'com.google.code.gson:gson:2.2.2'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
    implementation 'jakarta.xml.ws:jakarta.xml.ws-api:4.0.2'
    implementation 'jakarta.jws:jakarta.jws-api:3.0.0'
    implementation 'org.projectlombok:lombok:1.18.36'
    implementation 'com.sun.xml.ws:jaxws-rt:4.0.3'

    // Logging
    testImplementation 'org.apache.logging.log4j:log4j-api:2.1'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.1'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.1'
    implementation 'org.slf4j:slf4j-api:1.7.21'

    // Test
    testImplementation 'org.testng:testng:6.3.1'
    testImplementation "org.mockito:mockito-core:[2.0,)"
}

test {
    // enable TestNG support (default is JUnit)
    useTestNG {
        suites 'src/test/resources/testng.xml'
        // show standard out and standard error of the test JVM(s) on the console
        testLogging.showStandardStreams = true
        // This is to force the test task to execute everytime.
        outputs.upToDateWhen { false }
    } 
}

// Run functional tests 
task functionalTest(type: Test, dependsOn: 'test') {
    useTestNG() {
        suites 'src/test/resources/functional.xml'
    }
}

task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    // Using delomboked as a source
    from sourceSets.main.ext.delombok
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}