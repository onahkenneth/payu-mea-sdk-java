apply plugin: 'war'
apply from: 'https://raw.github.com/gretty-gradle-plugin/gretty/master/pluginScripts/gretty.plugin'

dependencies {
    implementation project(':payu-mea-java-sdk')
    implementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
    implementation 'log4j:log4j:1.2.14'
    implementation 'org.apache.logging.log4j:log4j-api:2.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.1'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.1'
    implementation 'org.slf4j:slf4j-api:1.7.21'
}